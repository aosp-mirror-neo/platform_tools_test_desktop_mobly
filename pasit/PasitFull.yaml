_pasit_full_topology: &pasit_full_topology
  PassportHost:
  - service_host: "localhost"
    service_port: 8300
    host_topology:
      connections:
      - parent_id: 'local_dut'
        child_id: '1912901'
        type: USBC
      - parent_id: '1912901'
        child_id: 'localhost:8080'
        type: IP_POWER
      - parent_id: 'localhost:8080'
        child_id: 'dock_1'
        type: USBC
      - parent_id: 'dock_1'
        child_id: '2007901'
        type: HDMI
      - parent_id: '2007901'
        child_id: 'monitor_1'
        type: HDMI
      - parent_id: 'dock_1'
        child_id: '2109002'
        type: HDMI
      - parent_id: '2109002'
        child_id: 'monitor_2'
        type: HDMI
      - parent_id: 'dock_1'
        child_id: 'j45sw01'
        type: ETHERNET
      - parent_id: 'j45sw01'
        child_id: 'network_1'
        type: ETHERNET
      - parent_id: 'dock_1'
        child_id: '2001901'
        type: USBA
      - parent_id: '2001901'
        child_id: 'device_1'
        type: HID
      - parent_id: '2001901'
        child_id: 'storage_1'
        type: STORAGE
      devices:
      - id: 'local_dut'
        type: DUT
      - id: '1912901'
        type: SWITCH_FIXTURE
      - id: 'dock_1'
        type: DOCKING_STATION
      - id: '2007901'
        type: SWITCH_FIXTURE
      - id: 'monitor_1'
        type: MONITOR
      - id: '2109002'
        type: SWITCH_FIXTURE
      - id: 'monitor_2'
        type: MONITOR
      - id: 'j45sw01'
        type: SWITCH_FIXTURE
      - id: 'network_1'
        type: NETWORK
      - id: '2001901'
        type: SWITCH_FIXTURE
      - id: 'device_1'
        type: HID
      - id: 'storage_1'
        type: STORAGE
      - id: 'localhost:8080'
        type: IP_POWER

_android_device: &android_device
  AndroidDevice: '*'



_servo_params: &servo_params
  servo_host: "localhost"
  servo_port: 9999

TestBeds:
- Name: pasit-full-android
  TestParams:
    <<: *servo_params
  Controllers:
    <<: *android_device
    <<: *pasit_full_topology
